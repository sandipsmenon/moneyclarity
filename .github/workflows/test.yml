name: Tests & Migrations

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: super-secret-jwt-signing-key-for-tests
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      OAUTH_REDIRECT_URL: http://localhost:8000/gmail/callback
      ENCRYPTION_SECRET: dGVzdC0zMi1ieXRlLWVuY3J5cHRpb24ta2V5MTIzNDU=
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=backend --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        if: ${{ secrets.CODECOV_TOKEN != '' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/ tests/

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations (dry-run check)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f migrations/001_initial_schema.sql
          psql -h localhost -U postgres -d postgres -f migrations/002_rls_policies.sql
          psql -h localhost -U postgres -d postgres -f migrations/003_triggers.sql
          echo "Migrations applied successfully"
